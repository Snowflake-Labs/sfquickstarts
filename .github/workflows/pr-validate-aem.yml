name: Validate markdown and stage (AEM)

# Runs against pull request code with a read-only token, and produces the validation
# artifact. Every privileged action happens in pr-deploy-aem.yml, which re-derives its
# own identifiers from the API rather than trusting anything this workflow uploads.
#
# No run: block interpolates ${{ }} and none is longer than one command. Context
# reaches the scripts through env: only, and each script validates what it receives.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions: {}

concurrency:
  group: validate-aem-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate_and_prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONPATH: scripts
    steps:
      # ref: pins the base commit; the default merge commit would contain PR code.
      - name: Checkout base repository (trusted scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/lib/
            scripts/validate/
            scripts/aem-staging/
            scripts/data/
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install --require-hashes -r scripts/requirements.txt

      - name: Collect pull request changes
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validate/collect_pr_changes.py

      # Runs unconditionally so validation-results.json always exists for the deploy
      # side to read; it exits early on its own when there is nothing relevant.
      - name: Run validations
        id: validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROFANITY_BLOCKLIST: ${{ vars.PROFANITY_BLOCKLIST }}
        run: python3 scripts/validate/run_validations.py

      - name: Stage payloads for deployment
        if: steps.validate.outputs.all_passed == 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validate/stage_payloads.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          retention-days: 7
          path: |
            validation-results.json
            pr-changes.json
            folder-rename-error.json
            multiple-md-error.json
            large-files-error.json
            categories-error.json
            frontmatter-error.json
            validation-error.json
            profanity-report.json
            non-markdown-root-info.json
            non-image-assets-warning.json
            parsed_content_*.json
            aem_payload_*.json
            images/
            sidebar-files/
          if-no-files-found: ignore
