name: Lint workflows and CI scripts

# Fails the build when a workflow drifts from the rules in scripts/ci/lint_workflows.py.
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'pyproject.toml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'pyproject.toml'

permissions: {}

concurrency:
  group: lint-workflows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: scripts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      - name: Install tooling
        run: pip install -r scripts/requirements-dev.txt -r scripts/requirements.txt

      # Runs first: it is the check that encodes this repository's own rules, and
      # its failures are the ones a contributor is least likely to predict.
      - name: Check workflow shape
        run: python3 scripts/ci/lint_workflows.py

      - name: Ruff lint
        run: ruff check --output-format github .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true
