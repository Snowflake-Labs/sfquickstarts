name: Build and upload quickstart manifest (test-only)

on:
  workflow_dispatch: {}
  push:
    branches:
      - manifest_weekly

permissions:
  contents: read

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Generate manifest
        run: |
          python3 "scripts/generate_manifest/manifest generator.py"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickstart-manifest-${{ github.sha }}
          path: site/sfguides/src/_shared_assets/quickstart-manifest.json
          if-no-files-found: error
          retention-days: 7

