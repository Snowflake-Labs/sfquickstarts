# First run: 5 questions, system metrics only. Cheap smoke test.
# Read by EXECUTE_AI_EVALUATION from @NORTHBANK_AGENT_EVALS.DEMO.EVAL_CONFIG_STAGE/probe_version1.yaml
evaluation:
  agent_params:
    agent_name: NORTHBANK_AGENT_EVALS.DEMO.LENDING_OPS_AGENT
    agent_type: CORTEX AGENT
    agent_version: VERSION$1
  run_params:
    label: 'Probe: VERSION$1 on 5 questions'
  source_metadata:
    type: dataset
    dataset_name: NORTHBANK_AGENT_EVALS.DEMO.NORTHBANK_EVAL_PROBE
metrics:
- name: answer_correctness
  version: v3_0
- name: logical_consistency
  version: v3_0
- name: tool_selection_accuracy
  version: v3_0
- name: tool_execution_accuracy
  version: v3_0
