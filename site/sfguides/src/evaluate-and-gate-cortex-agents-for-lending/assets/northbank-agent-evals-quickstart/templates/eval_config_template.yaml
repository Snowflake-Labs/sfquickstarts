# Template: evaluation config for YOUR agent, including one custom metric.
# Upload to a stage and run:
#   CALL EXECUTE_AI_EVALUATION('START', OBJECT_CONSTRUCT('run_name', '<unique_name>'),
#                              '@<DB>.<SCHEMA>.<STAGE>/my_agent_eval.yaml');
evaluation:
  agent_params:
    agent_name: <DB>.<SCHEMA>.<AGENT>
    agent_type: CORTEX AGENT
    agent_version: VERSION$1          # always a committed version in CI; never DEFAULT
  run_params:
    label: <what changed in this version>
  source_metadata:
    type: dataset
    dataset_name: <DB>.<SCHEMA>.MY_EVAL_V1
metrics:
# System metrics: pin the version so the judge cannot change between runs.
- name: answer_correctness
  version: v3_0
- name: tool_selection_accuracy      # deterministic, no judge cost
  version: v3_0
- name: tool_execution_accuracy
  version: v3_0
- name: logical_consistency          # most expensive: sends the whole trace to the judge
  version: v3_0

# Custom metric: write the rule your regulator or business owner would apply.
- name: <rule_name>
  model: <judge model>               # set it explicitly; the default follows deprecations
  score_ranges:                      # low / medium / high bands for the Snowsight colouring
    min_score: [0, 4]
    median_score: [4, 7]
    max_score: [7, 10]
  prompt: |
    You are a <role, e.g. compliance reviewer>. Score whether the assistant's answer <does the thing>.

    Question: {{input}}
    Answer: {{output}}
    Expected behaviour: {{ground_truth}}
    Tool calls and results in this trace: {{tool_info}}

    Check only these things, in order:
    1. <check one, phrased as a yes/no question>
    2. <check two>
    Checks that do not apply to this question count as passed.

    Score 10 if all applicable checks pass.
    Score 5 if the answer is broadly right but misses <a required step>.
    Score 0 if the answer would lead to <the harmful or non-compliant outcome>.
    Return only the integer score.
