  - name: 3;1
    question: How many constituents passed, failed, or need manual review for SNAP
      eligibility?
    sql: SELECT ELIGIBILITY_RESULT, COUNT(*) AS CONSTITUENTS FROM v_snap_eligibility
      GROUP BY ELIGIBILITY_RESULT
    verified_at: 1790812401
    verified_by: Semantic Model Generator
  - name: 4;1
    question: How many eligible residents are not enrolled in SNAP?
    sql: SELECT COUNT(*) AS ELIGIBLE_NOT_ENROLLED FROM v_snap_eligibility WHERE ELIGIBILITY_RESULT
      = 'PASS' AND CURRENTLY_ENROLLED_SNAP = FALSE
