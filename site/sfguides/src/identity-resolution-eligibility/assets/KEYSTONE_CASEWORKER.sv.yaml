    sql: SELECT MASTER_ID, FIRST_NAME, LAST_NAME, SOURCE_RECORD_COUNT, SYSTEMS_FOUND_IN,
      DETERMINISTIC_MATCHES, PROBABILISTIC_MATCHES, BEST_MATCH_SCORE, ELIGIBILITY_RESULT,
