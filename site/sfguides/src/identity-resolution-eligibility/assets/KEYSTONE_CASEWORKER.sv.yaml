    sql: SELECT SOURCE_RECORDS, CONSTITUENTS, MULTI_SYSTEM, DUPLICATES, ELIG_PASS,
      ELIG_FAIL, ELIG_REVIEW, ELIGIBLE_NOT_ENROLLED, RAW_EVENT_COUNT, RESOLVED_EVENT_COUNT,
