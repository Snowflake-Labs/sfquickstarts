# =============================================================================
# PE Agentic System - Model Routing Configuration
# =============================================================================
# Central, config-driven model selection. Any model/price/routing value here can
# be changed WITHOUT touching code - the loaders in integrations/ read this file.
#
# Three concepts:
#   1. model_catalog   - every model the system knows about, with family, tier,
#                        cost and output-token metadata.
#   2. task_routing    - maps a PE task -> a tier (reasoning / balanced / cheap).
#                        This is where you decide WHICH kind of model a task needs.
#   3. platforms       - per-provider overrides (which model ID to use for each
#                        tier on OpenAI vs Bedrock vs Cortex).
#
# "Showcase" entries: GPT 5.6, GPT Sol, Claude Opus (heavy reasoning) vs
# Llama / Mistral / Haiku-class (cheap & fast).
# =============================================================================

platforms:
  cortex:
    family: "gpt"
    env_prefix: "SNOWFLAKE"
    auth: "session"
  openai:
    family: "gpt"
    env_prefix: "OPENAI"
    auth: "api_key"
  bedrock:
    family: "claude"
    env_prefix: "AWS"
    auth: "iam"

# -----------------------------------------------------------------------------
# Model catalog: every model the system can reference.
#   available: true  -> confirmed live on <your account> (200)
#   available: false -> reference only; NOT provisioned on this account (400)
# -----------------------------------------------------------------------------
model_catalog:
  # ---------------- GPT (OpenAI) ----------------
  openai-gpt-5.6:
    family: "gpt"
    tier: "reasoning"
    cost_rank: "high"
    available: false
    max_output_tokens: 32768
    description: "OpenAI GPT 5.6 - flagship reasoning model (NOT available on this account)"
  openai-gpt-sol:
    family: "gpt"
    tier: "reasoning"
    cost_rank: "high"
    available: false
    max_output_tokens: 32768
    description: "OpenAI GPT Sol - high-throughput reasoning model (NOT available on this account)"
  openai-gpt-5.4:
    family: "gpt"
    tier: "reasoning"
    cost_rank: "high"
    available: true
    max_output_tokens: 32768
    description: "OpenAI GPT 5.4 - reasoning model (live)"
  openai-gpt-5.1:
    family: "gpt"
    tier: "balanced"
    cost_rank: "mid"
    available: true
    max_output_tokens: 16384
    description: "OpenAI GPT 5.1 - strong general + code generation, lower cost (live)"

  # ---------------- Claude (Anthropic) ----------------
  claude-opus-4-6:
    family: "claude"
    tier: "reasoning"
    cost_rank: "high"
    available: true
    max_output_tokens: 16384
    description: "Anthropic Claude Opus 4.6 - deepest reasoning (DD memos, IC analysis) (live)"
  claude-sonnet-4-5:
    family: "claude"
    tier: "balanced"
    cost_rank: "mid"
    available: true
    max_output_tokens: 16384
    description: "Anthropic Claude Sonnet 4.5 - fast, accurate extraction & balanced tasks (live)"

  # ---------------- Mistral ----------------
  mistral-large-2-2:
    family: "mistral"
    tier: "balanced"
    cost_rank: "mid"
    available: false
    max_output_tokens: 32768
    description: "Mistral Large 2.2 - cost-effective at scale (NOT available on this account)"

  # ---------------- Open / cheap ----------------
  llama-4.1-nemotron:
    family: "open"
    tier: "cheap"
    cost_rank: "low"
    available: false
    max_output_tokens: 4096
    description: "Llama 4.1 Nemotron - open, cheap, fine-tuneable (NOT available on this account)"

  # ---------------- Bedrock Claude (mapped for the bedrock platform) --------
  anthropic.claude-3-opus-20240229-v1:
    family: "claude"
    tier: "reasoning"
    cost_rank: "high"
    max_output_tokens: 32768
    description: "AWS Bedrock Claude 3 Opus - deep reasoning"
  anthropic.claude-3-sonnet-20240229-v1:
    family: "claude"
    tier: "balanced"
    cost_rank: "mid"
    max_output_tokens: 32768
    description: "AWS Bedrock Claude 3 Sonnet - balanced"
  anthropic.claude-3-haiku-20240307-v1:
    family: "claude"
    tier: "cheap"
    cost_rank: "low"
    max_output_tokens: 32768
    description: "AWS Bedrock Claude 3 Haiku - cheap & fast extraction"

# -----------------------------------------------------------------------------
# Task routing - which TIER each PE task needs.
#   tier: reasoning -> heavy model (costly, capable)
#        balanced   -> mid model
#        cheap      -> lightweight model (fast, inexpensive)
# Reason the tiers:
#   * IC memos / DD analysis / complex legal-commercial reasoning  -> reasoning
#   * Financial model codegen (DCF/LBO) that must be executable      -> reasoning
#   * Document extraction / entity pull / summarization / portfolio  -> cheap
# -----------------------------------------------------------------------------
task_routing:
  reasoning:      { tier: "reasoning" }   # DD memos, IC analysis, deal judgment
  modeling:       { tier: "reasoning" }   # executable DCF/LBO code generation
  extraction:     { tier: "cheap" }       # pull metrics/entities from documents
  summarization:  { tier: "cheap" }       # concise summaries, portfolio reports
  default:        { tier: "balanced" }

# -----------------------------------------------------------------------------
# Per-platform: which model ID to use for each tier.
# Falls back to family_defaults if a tier is missing for that platform.
# -----------------------------------------------------------------------------
platform_tiers:
  cortex:
    reasoning: "claude-opus-4-6"
    balanced:  "claude-sonnet-4-5"
    cheap:     "openai-gpt-5.1"
  openai:
    reasoning: "openai-gpt-5.4"
    balanced:  "openai-gpt-5.1"
    cheap:     "openai-gpt-5.1"
  bedrock:
    reasoning: "anthropic.claude-3-opus-20240229-v1"
    balanced:  "anthropic.claude-3-sonnet-20240229-v1"
    cheap:     "anthropic.claude-3-haiku-20240307-v1"

# -----------------------------------------------------------------------------
# Family default per tier (used when a platform doesn't override a tier).
# -----------------------------------------------------------------------------
family_defaults:
  gpt:
    reasoning: "openai-gpt-5.4"
    balanced:  "openai-gpt-5.1"
    cheap:     "openai-gpt-5.1"
  claude:
    reasoning: "claude-opus-4-6"
    balanced:  "claude-sonnet-4-5"
    cheap:     "claude-sonnet-4-5"
  mistral:
    reasoning: "openai-gpt-5.4"
    balanced:  "openai-gpt-5.1"
    cheap:     "openai-gpt-5.1"
  open:
    reasoning: "openai-gpt-5.4"
    balanced:  "openai-gpt-5.1"
    cheap:     "openai-gpt-5.1"

# -----------------------------------------------------------------------------
# Showcase: side-by-side illustrations of reasoning vs cheap model usage.
# -----------------------------------------------------------------------------
showcase:
  title: "When to use a reasoning model vs a cheaper model"
  reasoning_tasks:
    - "Investment Committee (IC) memo drafting"
    - "Deep due-diligence / red-flag analysis on long documents"
    - "Executable financial model generation (DCF, LBO, cap table)"
    - "Deal thesis synthesis across many sources"
  cheap_tasks:
    - "Extracting metrics / entities / table fields from a CIM"
    - "Portfolio KPI summarization and traffic-light statusing"
    - "Bulk document classification / triage"
    - "Routine Q&A on structured data"
  guidance: |
    Use a reasoning-tier model (Claude Opus 4.6, GPT 5.4) when the task needs
    multi-step judgment, long-context synthesis, or correct code that must run.
    Use a cheap/balanced-tier model (GPT 5.1, Claude Sonnet 4.5) for high-volume
    mechanical work where per-token cost and latency dominate quality headroom.
    NOTE: GPT 5.6, GPT Sol, Llama and Mistral IDs are shown for reference but are
    NOT available on this account (HTTP 400) - the live tier mappings above use
    confirmed-available models only.
