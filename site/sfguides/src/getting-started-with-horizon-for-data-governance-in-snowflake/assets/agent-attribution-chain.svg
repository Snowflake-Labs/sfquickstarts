<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="430" rx="16" fill="#ffffff"/>
  <text x="490" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#11567f">Governed access, request traces, and SQL correlation</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa7b1"/>
    </marker>
  </defs>

  <!-- three entry paths -->
  <g font-size="14" font-weight="700">
    <rect x="40" y="90" width="210" height="60" rx="10" fill="#eef6fb" stroke="#29B5E8" stroke-width="2"/>
    <text x="145" y="116" text-anchor="middle" fill="#0c3f5c">SQL</text>
    <text x="145" y="136" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b77">DATA_AGENT_RUN</text>

    <rect x="40" y="185" width="210" height="60" rx="10" fill="#efe7fa" stroke="#7D44CF" stroke-width="2"/>
    <text x="145" y="211" text-anchor="middle" fill="#3a1d6e">REST API</text>
    <text x="145" y="231" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b77">key-pair JWT</text>

    <rect x="40" y="280" width="210" height="60" rx="10" fill="#e9f7ee" stroke="#3aa76d" stroke-width="2"/>
    <text x="145" y="306" text-anchor="middle" fill="#1f6b43">Snowflake CoWork</text>
    <text x="145" y="326" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b77">manual chat (UI)</text>
  </g>

  <!-- governed agent -->
  <rect x="370" y="160" width="220" height="110" rx="12" fill="#eaf1f6" stroke="#11567f" stroke-width="2.5"/>
  <text x="480" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#0c3f5c">CUSTOMER_</text>
  <text x="480" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#0c3f5c">INSIGHTS_AGENT</text>
  <text x="480" y="244" text-anchor="middle" font-size="12" fill="#5b6b77">model RBAC + FGAC</text>
  <text x="480" y="260" text-anchor="middle" font-size="12" fill="#5b6b77">+ Agent Identity</text>

  <g stroke="#9aa7b1" stroke-width="2.5" marker-end="url(#arrow3)">
    <line x1="250" y1="120" x2="366" y2="190"/>
    <line x1="250" y1="215" x2="366" y2="215"/>
    <line x1="250" y1="310" x2="366" y2="240"/>
  </g>

  <!-- fingerprint -->
  <rect x="680" y="120" width="260" height="58" rx="10" fill="#fff4e0" stroke="#e0962a" stroke-width="2"/>
  <text x="810" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a12">QUERY_TAG =</text>
  <text x="810" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a12">cortex-agent-{request_id}</text>

  <!-- join -->
  <rect x="680" y="252" width="260" height="78" rx="10" fill="#eaf1f6" stroke="#11567f" stroke-width="2"/>
  <text x="810" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c3f5c">Native agent / CoWork usage</text>
  <text x="810" y="298" text-anchor="middle" font-size="12" fill="#5b6b77">left-joined to QUERY_HISTORY</text>
  <text x="810" y="316" text-anchor="middle" font-size="12" fill="#5b6b77">request role + execution role + query ID</text>

  <g stroke="#9aa7b1" stroke-width="2.5" marker-end="url(#arrow3)">
    <line x1="590" y1="200" x2="676" y2="160"/>
    <line x1="810" y1="178" x2="810" y2="248"/>
  </g>

  <text x="490" y="390" text-anchor="middle" font-size="14" fill="#11567f">Use traces for tool context, query IDs for SQL, and usage views for delayed cost accounting.</text>
</svg>
