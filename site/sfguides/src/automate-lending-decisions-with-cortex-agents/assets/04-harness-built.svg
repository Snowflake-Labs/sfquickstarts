<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="ttl">Anatomy of a Cortex Agent for loan underwriting</title>
<desc id="dsc">A circuit-board diagram. A model chip at the centre is labelled MODEL, reasons, plans, decides. Six zones surround it, each tinted a very pale blue, and every item inside a zone is coloured by the lab module that built it: light blue for Module 3, dark blue for Module 4. A legend beneath the HARNESS label states this. Down the left: CONTEXT, holding the APPLICATION_ANALYTICS semantic view and the credit analyst instructions from Module 3, plus the underwriting agent instructions from Module 4; CONTROL, holding the 120 second and 32k token budget for the credit analyst and the 300 second budget when documents are involved from Module 3, plus escalation on an unverifiable file from Module 4; and OBSERVE, holding evaluation runs from baseline to improved from Module 3, plus traces per conversation from Module 4. Down the right: RETRIEVE, holding the application_analytics tool over Cortex Analyst and the document_search tool over Cortex Search, both from Module 3; ACT, holding write_credit_memo and recompute_dti from Module 3, plus policy_check, record_decision and the credit analyst agent called over MCP from Module 4; and PERSIST, holding the CREDIT_MEMO table from Module 3, plus the decision on the loan application and the UNDERWRITING_LOG from Module 4. RETRIEVE is the only zone built entirely in Module 3, and it carries the palest tint; the other five mix both modules. A dashed inner boundary around all six zones is labelled HARNESS. A dashed outer boundary is labelled AGENT. The hatched band between the two boundaries runs unbroken around every zone and is labelled GOVERNANCE, role-based access control, policy enforced outside the model.</desc>
